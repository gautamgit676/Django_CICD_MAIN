services:

  web:
    image: gautam147/pro:latest

    command: gunicorn pro.wsgi:application --bind 0.0.0.0:8000

    expose:
      - "8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

    restart: always

  worker:
    image: gautam147/pro:latest

    command: celery -A pro worker -l info

    env_file:
      - .env

    depends_on:
      - redis
      - db

    restart: always

  beat:
    image: gautam147/pro:latest

    command: celery -A pro beat -l info

    env_file:
      - .env

    depends_on:
      - redis
      - db

    restart: always


  db:
    image: postgres:17

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always


  redis:
    image: redis:8
    
    restart: always


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/pro/staticfiles
      - ./media:/pro/media

    depends_on:
      - web

    restart: always


volumes:
  postgres_data:
version: "3.9"

services:

  web:
    image: gautam147/pro:latest

    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); exit(s.connect_ex(('127.0.0.1',8000)))"]
      interval: 10s
      timeout: 5s
      retries: 5

    command: gunicorn pro.wsgi:application --bind 0.0.0.0:8000

    expose:
      - "8000"

    volumes:
      - static_volume:/pro/staticfiles
      - media_volume:/pro/media

    env_file:
      - .env

    depends_on:
      - redis

    restart: always


  worker:
    image: gautam147/pro:latest

    command: celery -A pro worker -l info

    env_file:
      - .env

    depends_on:
      - redis

    restart: always


  beat:
    image: gautam147/pro:latest

    command: celery -A pro beat -l info

    env_file:
      - .env

    depends_on:
      - redis

    restart: always


  redis:
    image: redis:8

    restart: always


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/pro/staticfiles
      - media_volume:/pro/media

    depends_on:
      web:
        condition: service_healthy

    restart: always


volumes:
  static_volume:
  media_volume: